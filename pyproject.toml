[project]
name = "compton-lab"
version = "0.1.0"
description = "Compton scattering, Klein-Nishina cross section and Wu-Shaknov experiment: lab analysis code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "jupyterlab",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_compton"]
